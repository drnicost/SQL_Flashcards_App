<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spark SQL">
<meta name="theme-color" content="#020617">
<title>Spark SQL Flashcards</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
    background: #020617;
    color: #f1f5f9;
    overflow: hidden;
  }
  .app {
    height: 100vh;
    height: 100dvh;
    max-width: 560px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 16px);
    display: flex;
    flex-direction: column;
  }
  .kopf { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .logo {
    width: 38px; height: 38px; border-radius: 11px; flex-shrink: 0;
    background: rgba(249,115,22,.18); border: 1px solid rgba(249,115,22,.45);
    display: flex; align-items: center; justify-content: center; font-size: 19px;
  }
  .kopf h1 { font-size: 17px; font-weight: 700; line-height: 1.2; }
  .kopf .stand { font-size: 11px; color: #94a3b8; margin-top: 1px; }
  .kopf .reset {
    margin-left: auto; background: none; border: 1px solid #334155; color: #94a3b8;
    border-radius: 10px; width: 34px; height: 34px; font-size: 16px; line-height: 1;
  }
  .chips { display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: 4px; margin-bottom: 12px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0; padding: 7px 13px; border-radius: 999px; font-size: 12px; font-weight: 600;
    background: transparent; border: 1px solid #334155; color: #cbd5e1;
  }
  .chip.aktiv { background: #f97316; border-color: #f97316; color: #020617; }
  .balken { height: 6px; background: #1e293b; border-radius: 999px; overflow: hidden; margin-bottom: 14px; }
  .balken > div { height: 100%; background: #f97316; border-radius: 999px; transition: width .3s; }
  .szene-flex { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .szene {
    flex: 1; perspective: 1200px; min-height: 0;
    transition: transform .35s cubic-bezier(.25,.8,.35,1), opacity .35s;
  }
  .karte {
    position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d; transition: transform .5s;
    cursor: pointer; -webkit-user-select: none; user-select: none;
  }
  .karte.gedreht { transform: rotateY(180deg); }
  .seite {
    position: absolute; inset: 0; border-radius: 18px;
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .vorne { background: #0f172a; border: 1px solid #1e293b; padding: 18px 18px 14px; }
  .hinten {
    background: #0f172a; border: 1px solid rgba(249,115,22,.45);
    transform: rotateY(180deg); padding: 18px 18px 14px;
  }
  .meta { display: flex; justify-content: space-between; margin-bottom: 12px; }
  .meta .kat { font-size: 10px; text-transform: uppercase; letter-spacing: .12em; font-weight: 700; color: #fb923c; }
  .meta .nr { font-size: 10px; color: #64748b; }
  .v-frage { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 18px; font-weight: 600; line-height: 1.45; padding: 0 6px; }
  .v-hint { font-size: 11px; color: #64748b; text-align: center; }
  .h-text { font-size: 14px; line-height: 1.55; color: #e2e8f0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .h-code {
    margin-top: auto; background: #020617; border: 1px solid #1e293b; border-radius: 12px;
    padding: 12px; overflow-x: auto; -webkit-overflow-scrolling: touch;
  }
  .h-code code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; line-height: 1.55; color: #fed7aa; white-space: pre; }
  .buttons { display: flex; gap: 10px; margin-top: 14px; }
  .btn {
    flex: 1; min-height: 50px; border: none; border-radius: 13px;
    font-size: 14px; font-weight: 700; font-family: inherit;
  }
  .btn:active { opacity: .8; }
  .btn-primary { background: #f97316; color: #020617; }
  .btn-gruen { background: #059669; color: #fff; }
  .btn-rot { background: #e11d48; color: #fff; }
  .btn-outline { background: transparent; border: 1px solid #334155; color: #e2e8f0; }
  .swipe-hint { text-align: center; font-size: 10px; color: #64748b; margin-top: 8px; }
  .ende {
    flex: 1; background: #0f172a; border: 1px solid #1e293b; border-radius: 18px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
  }
  .ende .emoji { font-size: 44px; margin-bottom: 10px; }
  .ende h2 { font-size: 17px; margin-bottom: 6px; }
  .ende p { font-size: 13px; color: #94a3b8; margin-bottom: 20px; line-height: 1.5; }
  .ende .buttons { width: 100%; max-width: 340px; flex-direction: column; }
  .ende .btn { flex: none; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
(function () {
  "use strict";

  var KARTEN = [
    { id: 1, kategorie: "Grundlagen & Filter", frage: "Wie wählst du bestimmte Spalten aus und gibst ihnen einen Alias?", antwort: "Mit SELECT liste ich die Spalten auf. Mit AS vergebe ich einen Alias, mit * wähle ich alle Spalten.", code: "SELECT name, preis AS preis_euro\nFROM produkte;" },
    { id: 2, kategorie: "Grundlagen & Filter", frage: "Wie entfernst du doppelte Zeilen aus dem Ergebnis?", antwort: "Mit DISTINCT direkt nach SELECT. Spark entfernt dann alle vollständig identischen Zeilen.", code: "SELECT DISTINCT kategorie\nFROM produkte;" },
    { id: 3, kategorie: "Grundlagen & Filter", frage: "Wie filterst du Zeilen nach einer Bedingung?", antwort: "Mit WHERE. Der Filter wird angewendet, bevor gruppiert oder sortiert wird (Ausnahme: Aggregationen, dafür gibt es HAVING).", code: "SELECT *\nFROM verkaeufe\nWHERE betrag > 100 AND region = 'EU';" },
    { id: 4, kategorie: "Grundlagen & Filter", frage: "Wie suchst du nach einem Muster in einem Text (Groß-/Kleinschreibung egal)?", antwort: "Mit LIKE und Platzhaltern (% für beliebig viele Zeichen, _ für genau eines). ILIKE ignoriert Groß-/Kleinschreibung.", code: "SELECT * FROM kunden\nWHERE name ILIKE '%berg%';" },
    { id: 5, kategorie: "Grundlagen & Filter", frage: "Wie filterst du auf einen Wertebereich oder eine Liste von Werten?", antwort: "BETWEEN für einen inklusiven Bereich, IN für eine feste Liste möglicher Werte.", code: "SELECT * FROM bestellungen\nWHERE menge BETWEEN 10 AND 50\n  AND status IN ('offen', 'versendet');" },
    { id: 6, kategorie: "Grundlagen & Filter", frage: "Wie sortierst du das Ergebnis und begrenzt die Anzahl Zeilen?", antwort: "Mit ORDER BY (ASC aufsteigend, DESC absteigend) und LIMIT für die maximale Zeilenzahl.", code: "SELECT name, betrag\nFROM verkaeufe\nORDER BY betrag DESC\nLIMIT 10;" },
    { id: 7, kategorie: "Grundlagen & Filter", frage: "Wie gehst du mit NULL-Werten um?", antwort: "Vergleiche mit IS NULL / IS NOT NULL (nicht mit = NULL!). COALESCE liefert den ersten Nicht-NULL-Wert, NULLIF setzt bei Vergleichsgleichheit auf NULL.", code: "SELECT name,\n       COALESCE(telefon, 'unbekannt') AS tel\nFROM kunden\n WHERE email IS NOT NULL;" },
    { id: 8, kategorie: "Aggregation & Joins", frage: "Wie bildest du Summen/Kennzahlen pro Gruppe?", antwort: "Mit GROUP BY. Alle Nicht-Schlüssel-Spalten im SELECT müssen aggregiert werden.", code: "SELECT region, SUM(betrag) AS summe\nFROM verkaeufe\nGROUP BY region;" },
    { id: 9, kategorie: "Aggregation & Joins", frage: "Wie filterst du das Ergebnis einer Aggregation?", antwort: "Mit HAVING. WHERE filtert Zeilen vor, HAVING filtert Gruppen nach der Aggregation.", code: "SELECT kunde_id, COUNT(*) AS anzahl\nFROM bestellungen\nGROUP BY kunde_id\nHAVING COUNT(*) > 5;" },
    { id: 10, kategorie: "Aggregation & Joins", frage: "Was ist der Unterschied zwischen COUNT(*) und COUNT(spalte)?", antwort: "COUNT(*) zählt alle Zeilen, COUNT(spalte) zählt nur Zeilen, in denen die Spalte nicht NULL ist. SUM/AVG/MIN/MAX ignorieren NULLs ebenfalls.", code: "SELECT COUNT(*) AS zeilen,\n       COUNT(rabatt) AS mit_rabatt\nFROM bestellungen;" },
    { id: 11, kategorie: "Aggregation & Joins", frage: "Welche JOIN-Arten gibt es und was machen sie?", antwort: "INNER JOIN: nur übereinstimmende Zeilen. LEFT/RIGHT JOIN: alle Zeilen einer Seite, fehlende Werte als NULL. FULL OUTER: beide Seiten komplett.", code: "SELECT k.name, b.betrag\nFROM kunden k\nLEFT JOIN bestellungen b ON k.id = b.kunde_id;" },
    { id: 12, kategorie: "Aggregation & Joins", frage: "Was ist der Unterschied zwischen UNION und UNION ALL?", antwort: "UNION entfernt Duplikate (teurer), UNION ALL hält alle Zeilen (schneller). Beide brauchen gleiche Spaltenzahl und -typen.", code: "SELECT kunde_id FROM eu_kunden\nUNION ALL\nSELECT kunde_id FROM us_kunden;" },
    { id: 13, kategorie: "Aggregation & Joins", frage: "Wie gliederst du eine komplexe Abfrage in lesbare Schritte?", antwort: "Mit WITH (Common Table Expression). Die benannten Zwischenergebnisse können im weiteren Verlauf wie Tabellen genutzt werden.", code: "WITH umsatz AS (\n  SELECT region, SUM(betrag) AS summe\n  FROM verkaeufe GROUP BY region\n)\nSELECT * FROM umsatz WHERE summe > 1000;" },
    { id: 14, kategorie: "Fensterfunktionen", frage: "Wie nummerierst du Zeilen innerhalb von Gruppen fortlaufend?", antwort: "Mit ROW_NUMBER() und OVER (PARTITION BY ... ORDER BY ...). Ideal um z.B. nur die neueste Zeile pro Gruppe zu behalten.", code: "SELECT *, ROW_NUMBER() OVER (\n  PARTITION BY kunde_id ORDER BY datum DESC\n) AS rn\nFROM bestellungen;" },
    { id: 15, kategorie: "Fensterfunktionen", frage: "Was ist der Unterschied zwischen RANK() und DENSE_RANK()?", antwort: "Bei Gleichstand: RANK überspringt die nächsten Plätze (1,1,3), DENSE_RANK nicht (1,1,2). ROW_NUMBER vergibt immer eindeutige Nummern.", code: "SELECT name, punkte,\n  RANK() OVER (ORDER BY punkte DESC) AS r,\n  DENSE_RANK() OVER (ORDER BY punkte DESC) AS dr\nFROM spieler;" },
    { id: 16, kategorie: "Fensterfunktionen", frage: "Wie greifst du auf den vorherigen oder nächsten Zeilenwert zu?", antwort: "Mit LAG (Zeile darüber) und LEAD (Zeile darunter), jeweils mit OVER. Nützlich für Veränderungen, z.B. Umsatz vs. Vormonat.", code: "SELECT monat, umsatz,\n  LAG(umsatz) OVER (ORDER BY monat) AS vormonat,\n  umsatz - LAG(umsatz) OVER (ORDER BY monat) AS delta\nFROM monatsumsatz;" },
    { id: 17, kategorie: "Fensterfunktionen", frage: "Wie bildest du laufende Summen oder Durchschnitte?", antwort: "Mit einer Aggregatfunktion plus OVER und ORDER BY. Ohne PARTITION BY läuft die Berechnung über die ganze Ergebnismenge.", code: "SELECT datum, betrag,\n  SUM(betrag) OVER (ORDER BY datum) AS kum_summe,\n  AVG(betrag) OVER (PARTITION BY kunde_id) AS kunde_avg\nFROM verkaeufe;" },
    { id: 18, kategorie: "Funktionen & Ausdrücke", frage: "Wie erstellst du bedingte Werte in einer Spalte (IF-Logik)?", antwort: "Mit CASE WHEN ... THEN ... ELSE ... END. Das ELSE ist optional, ohne es kommt NULL.", code: "SELECT betrag,\n  CASE WHEN betrag >= 1000 THEN 'A'\n       WHEN betrag >= 100 THEN 'B'\n       ELSE 'C' END AS klasse\nFROM verkaeufe;" },
    { id: 19, kategorie: "Funktionen & Ausdrücke", frage: "Wie wandelst du Datentypen sicher um?", antwort: "CAST wandelt um und wirft bei ungültigen Werten einen Fehler. TRY_CAST liefert stattdessen NULL. TRY_DIVIDE vermeidet Division durch Null.", code: "SELECT TRY_CAST('abc' AS INT) AS x, -- NULL\n       CAST('42' AS INT) AS y,\n       TRY_DIVIDE(betrag, menge) AS quote\nFROM t;" },
    { id: 20, kategorie: "Funktionen & Ausdrücke", frage: "Mit welchen Funktionen rechnest du mit Datumswerten?", antwort: "current_date() für heute, datediff() für Tagesdifferenz, date_add() zum Addieren, to_date()/to_timestamp() zum Parsen, date_trunc() zum Runden auf Monat/Jahr.", code: "SELECT current_date(),\n  datediff(current_date(), datum) AS tage_seit,\n  date_add(datum, 30) AS plus30,\n  date_trunc('MONTH', datum) AS monat\nFROM bestellungen;" },
    { id: 21, kategorie: "Funktionen & Ausdrücke", frage: "Welche String-Funktionen brauchst du oft?", antwort: "concat_ws() verbindet mit Trennzeichen, split() zerlegt, substring() schneidet aus, regexp_replace() ersetzt Muster, initcap() schreibt Anfangsbuchstaben groß.", code: "SELECT concat_ws(' ', vorname, nachname) AS name,\n  split(email, '@')[0] AS user,\n  regexp_replace(tel, '[^0-9]', '') AS tel_zahl\nFROM kunden;" },
    { id: 22, kategorie: "Funktionen & Ausdrücke", frage: "Wie machst du Array-Elemente zu eigenen Zeilen?", antwort: "Mit LATERAL VIEW explode() werden Array-Elemente in einzelne Zeilen aufgefächert (je Zeile im Array, sonst NULL).", code: "SELECT name, tag\nFROM mitarbeiter\nLATERAL VIEW explode(arbeitstage) t AS tag;" },
    { id: 23, kategorie: "Delta Lake & DDL", frage: "Wie erstellst du eine neue Tabelle in Spark SQL?", antwort: "Mit CREATE TABLE und USING gibst du das Format an (DELTA, PARQUET, CSV, JSON). COMMENT dokumentiert die Tabelle.", code: "CREATE TABLE verkaeufe (\n  id BIGINT,\n  betrag DECIMAL(10,2)\n)\nUSING DELTA\nCOMMENT 'Alle Verkäufe';" },
    { id: 24, kategorie: "Delta Lake & DDL", frage: "Was ist der Unterschied zwischen INSERT INTO und INSERT OVERWRITE?", antwort: "INSERT INTO hängt Zeilen an. INSERT OVERWRITE ersetzt die gesamte Tabelle (oder nur die Partition), ideal für Neuaufbau einer Partition.", code: "INSERT OVERWRITE verkaeufe\nSELECT * FROM staging_verkaeufe;\n\nINSERT INTO verkaeufe VALUES (1, 99.50);" },
    { id: 25, kategorie: "Delta Lake & DDL", frage: "Wie machst du Upserts (Einfügen ODER Aktualisieren) auf einer Delta-Tabelle?", antwort: "Mit MERGE INTO. Bei übereinstimmender Bedingung UPDATE, sonst INSERT. Der Standardbefehl für CDC-artige Ladungen.", code: "MERGE INTO ziel t\nUSING quelle s ON t.id = s.id\nWHEN MATCHED THEN UPDATE SET *\nWHEN NOT MATCHED THEN INSERT *;" },
    { id: 26, kategorie: "Delta Lake & DDL", frage: "Wie hältst du eine Delta-Tabelle schnell und sauber?", antwort: "OPTIMIZE mit ZORDER BY kompaktiert Dateien und ordnet sie nach häufig gefilterten Spalten. VACUUM entfernt veraltete Dateien endgültig.", code: "OPTIMIZE verkaeufe ZORDER BY (region, datum);\n\nVACUUM verkaeufe RETAIN 168 HOURS;" },
    { id: 27, kategorie: "Delta Lake & DDL", frage: "Wie fügst du nachträglich Spalten zu einer bestehenden Tabelle hinzu?", antwort: "Mit ALTER TABLE ADD COLUMNS. Mit SET TBLPROPERTIES setzt du Eigenschaften, mit RENAME TO benennst du um.", code: "ALTER TABLE verkaeufe\nADD COLUMNS (region STRING);\n\nALTER TABLE verkaeufe RENAME TO sales;" },
    { id: 28, kategorie: "Delta Lake & DDL", frage: "Wie verschaffst du dir einen Überblick über vorhandene Tabellen?", antwort: "SHOW TABLES listet Tabellen, DESCRIBE DETAIL zeigt physische Details (Format, Größe, Zeilen), SHOW CREATE TABLE zeigt die DDL.", code: "SHOW TABLES IN meinedb;\n\nDESCRIBE DETAIL verkaeufe;\n\nSHOW CREATE TABLE verkaeufe;" },
    { id: 29, kategorie: "Delta Lake & DDL", frage: "Wie löschst du Daten – und was ist der Unterschied zu DROP?", antwort: "DELETE FROM entfernt Zeilen (bei Delta mit Time Travel wiederherstellbar), TRUNCATE leert die Tabelle komplett, DROP TABLE löscht die Tabelle selbst.", code: "DELETE FROM verkaeufe WHERE jahr < 2020;\n\nTRUNCATE TABLE staging;\n\nDROP TABLE IF EXISTS alt;" },
    { id: 30, kategorie: "Delta Lake & DDL", frage: "Wie bringst du eine viel genutzte Tabelle schneller in den Speicher?", antwort: "CACHE TABLE lädt die Tabelle in den Spark-Cache, UNCACHE gibt sie wieder frei. Clear Cache, wenn die Daten sich ändern.", code: "CACHE TABLE verkaeufe;\n\nSELECT COUNT(*) FROM verkaeufe; -- aus Cache\n\nUNCACHE TABLE IF EXISTS verkaeufe;" }
  ];

  var KATEGORIEN = ["Alle", "Grundlagen & Filter", "Aggregation & Joins", "Fensterfunktionen", "Funktionen & Ausdrücke", "Delta Lake & DDL"];
  var SPEICHER = "spark-sql-flashcards-v1";
  var app = document.getElementById("app");
  var state = null;

  function mische(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function speichere() {
    try {
      localStorage.setItem(SPEICHER, JSON.stringify({
        filter: state.filter, stapel: state.stapel, idx: state.idx,
        gewusst: state.gewusst, verpasst: state.verpasst
      }));
    } catch (e) { /* Sandbox/privater Modus: Fortschritt gilt nur für diese Sitzung */ }
  }

  function lade() {
    try {
      var raw = localStorage.getItem(SPEICHER);
      if (raw) {
        var s = JSON.parse(raw);
        if (s && Array.isArray(s.stapel) && s.stapel.length &&
            KATEGORIEN.indexOf(s.filter) !== -1 &&
            KARTEN.every(function (k) { return karteById(k.id) !== undefined; })) {
          state = { filter: s.filter, stapel: s.stapel, idx: s.idx || 0,
                    gewusst: s.gewusst || [], verpasst: s.verpasst || [] };
          state.stapel = state.stapel.filter(function (id) { return karteById(id); });
          if (state.idx > state.stapel.length) state.idx = state.stapel.length;
          return;
        }
      }
    } catch (e) { /* ignorieren, frischer Start */ }
    neuerStapel("Alle", null);
  }

  function karteById(id) {
    for (var i = 0; i < KARTEN.length; i++) if (KARTEN[i].id === id) return KARTEN[i];
    return undefined;
  }

  function neuerStapel(filter, kartenListe) {
    var basis = kartenListe;
    if (!basis) {
      basis = filter === "Alle" ? KARTEN.slice()
        : KARTEN.filter(function (k) { return k.kategorie === filter; });
    }
    state = {
      filter: filter || state.filter,
      stapel: mische(basis.map(function (k) { return k.id; })),
      idx: 0, gewusst: [], verpasst: []
    };
    speichere();
    render();
  }

  var gedreht = false;

  function drehen() { gedreht = !gedreht; render(); }

  function bewerten(gut) {
    var id = state.stapel[state.idx];
    var set = gut ? state.gewusst : state.verpasst;
    if (set.indexOf(id) === -1) set.push(id);
    state.idx += 1;
    gedreht = false;
    speichere();
    render();
  }

  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function render() {
    var fertig = state.idx >= state.stapel.length;
    var prozent = Math.min(state.idx / state.stapel.length * 100, 100);
    var html = "";

    html += '<div class="kopf">';
    html += '<div class="logo">⚡</div>';
    html += '<div><h1>Spark SQL Flashcards</h1>';
    html += '<div class="stand">' + state.stapel.length + ' Karten · ' + state.gewusst.length + ' gewusst · ' + state.verpasst.length + ' verpasst</div></div>';
    html += '<button class="reset" id="resetBtn" aria-label="Fortschritt zurücksetzen">↺</button>';
    html += '</div>';

    html += '<div class="chips">';
    for (var c = 0; c < KATEGORIEN.length; c++) {
      var kat = KATEGORIEN[c];
      html += '<button class="chip' + (state.filter === kat ? ' aktiv' : '') + '" data-kat="' + esc(kat) + '">' + esc(kat) + '</button>';
    }
    html += '</div>';

    html += '<div class="balken"><div style="width:' + prozent + '%"></div></div>';

    if (fertig) {
      html += '<div class="szene-flex"><div class="ende">';
      html += '<div class="emoji">' + (state.gewusst.length >= state.verpasst.length ? '🎉' : '💪') + '</div>';
      html += '<h2>Runde geschafft! ' + state.gewusst.length + ' von ' + state.stapel.length + ' gewusst.</h2>';
      html += '<p>' + (state.verpasst.length === 0
        ? 'Alles saß, starke Leistung.'
        : state.verpasst.length + ' Karten landen in der nächsten Wiederholungsrunde.') + '</p>';
      html += '<div class="buttons">';
      if (state.verpasst.length > 0) {
        html += '<button class="btn btn-primary" id="wdhlBtn">Verpasste wiederholen (' + state.verpasst.length + ')</button>';
      }
      html += '<button class="btn btn-outline" id="neuBtn">Ganze Runde neu</button>';
      html += '</div></div></div>';
    } else {
      var k = karteById(state.stapel[state.idx]);
      html += '<div class="szene-flex"><div class="szene" id="szene">';
      html += '<div class="karte' + (gedreht ? ' gedreht' : '') + '" id="karteEl">';
      html += '<div class="seite vorne">';
      html += '<div class="meta"><span class="kat">' + esc(k.kategorie) + '</span><span class="nr">' + (state.idx + 1) + ' / ' + state.stapel.length + '</span></div>';
      html += '<div class="v-frage">' + esc(k.frage) + '</div>';
      html += '<div class="v-hint">Tippen zum Umdrehen</div>';
      html += '</div>';
      html += '<div class="seite hinten">';
      html += '<div class="meta"><span class="kat">' + esc(k.kategorie) + '</span></div>';
      html += '<div class="h-text">' + esc(k.antwort) + '</div>';
      html += '<div class="h-code"><code>' + esc(k.code || "") + '</code></div>';
      html += '</div>';
      html += '</div></div>';
      html += '<div class="buttons">';
      if (gedreht) {
        html += '<button class="btn btn-gruen" id="okBtn">✓ Gewusst</button>';
        html += '<button class="btn btn-rot" id="noBtn">✗ Verpasst</button>';
      } else {
        html += '<button class="btn btn-primary" id="flipBtn">Antwort zeigen</button>';
      }
      html += '</div>';
      html += '<div class="swipe-hint">' + (gedreht ? 'Wischen: rechts ✓ · links ✗' : 'Tippen zum Umdrehen') + '</div>';
      html += '</div>';
    }

    app.innerHTML = html;

    // Events
    document.getElementById("resetBtn").addEventListener("click", function () {
      if (window.confirm("Fortschritt zurücksetzen und neue Runde starten?")) {
        try { localStorage.removeItem(SPEICHER); } catch (e) {}
        neuerStapel(state.filter, null);
      }
    });
    var chips = app.querySelectorAll(".chip");
    for (var i = 0; i < chips.length; i++) {
      (function (chip) {
        chip.addEventListener("click", function () {
          if (chip.textContent !== state.filter) neuerStapel(chip.textContent, null);
        });
      })(chips[i]);
    }
    var fb = document.getElementById("flipBtn");
    if (fb) fb.addEventListener("click", drehen);
    var ob = document.getElementById("okBtn");
    if (ob) ob.addEventListener("click", function () { bewerten(true); });
    var nb = document.getElementById("noBtn");
    if (nb) nb.addEventListener("click", function () { bewerten(false); });
    var kb = document.getElementById("karteEl");
    if (kb) kb.addEventListener("click", drehen);
    var wb = document.getElementById("wdhlBtn");
    if (wb) wb.addEventListener("click", function () {
      var karten = state.verpasst.map(karteById).filter(Boolean);
      var alteIds = karten.map(function (kk) { return kk.id; });
      state.filter = "Alle";
      state.stapel = mische(alteIds);
      state.idx = 0; state.gewusst = []; state.verpasst = [];
      speichere(); render();
    });
    var nbtn = document.getElementById("neuBtn");
    if (nbtn) nbtn.addEventListener("click", function () { neuerStapel(state.filter, null); });

    // Wischgesten
    var szene = document.getElementById("szene");
    if (szene) {
      var startX = 0, startY = 0, dx = 0, aktiv = false;
      szene.addEventListener("touchstart", function (e) {
        if (e.touches.length !== 1) return;
        startX = e.touches[0].clientX; startY = e.touches[0].clientY;
        dx = 0; aktiv = true;
        szene.style.transition = "none";
      }, { passive: true });
      szene.addEventListener("touchmove", function (e) {
        if (!aktiv) return;
        dx = e.touches[0].clientX - startX;
        var dy = e.touches[0].clientY - startY;
        if (Math.abs(dx) < Math.abs(dy)) return; // vertikales Scrollen zulassen
        if (Math.abs(dx) > 8) e.preventDefault();
        szene.style.transform = "translateX(" + dx + "px)";
        szene.style.opacity = String(1 - Math.min(Math.abs(dx) / 240, 0.5));
      }, { passive: false });
      szene.addEventListener("touchend", function () {
        if (!aktiv) return;
        aktiv = false;
        szene.style.transition = "";
        szene.style.transform = "";
        szene.style.opacity = "";
        if (gedreht && Math.abs(dx) > 60) bewerten(dx > 0);
      });
      szene.addEventListener("touchcancel", function () {
        aktiv = false;
        szene.style.transition = "";
        szene.style.transform = "";
        szene.style.opacity = "";
      });
    }
  }

  lade();
})();
</script>
</body>
</html>
